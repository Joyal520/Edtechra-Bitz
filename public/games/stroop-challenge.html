<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stroop Challenge</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
<style>
:root{--bg1:#efeaff;--bg2:#cfe0ff;--ink:#1d1840;--muted:#6a6590;--card:#ffffffb8;--line:#1d184022;--stage:#17143a;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a1d6e;--bg2:#0d0a29;--ink:#f3f1ff;--muted:#aaa6d8;--card:#ffffff14;--line:#ffffff24}}
:root[data-theme="dark"]{--bg1:#2a1d6e;--bg2:#0d0a29;--ink:#f3f1ff;--muted:#aaa6d8;--card:#ffffff14;--line:#ffffff24}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:var(--bg2);overflow:hidden;user-select:none}
#bg{position:fixed;inset:0;background:radial-gradient(120% 80% at 50% 0%,var(--bg1),var(--bg2));transition:filter 1.4s ease}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:20}
#flash.good{animation:fg .45s ease-out}#flash.bad{animation:fb .5s ease-out}
@keyframes fg{0%{opacity:.5;background:radial-gradient(circle,transparent 40%,#2dff8a66)}100%{opacity:0}}
@keyframes fb{0%{opacity:.7;background:radial-gradient(circle,transparent 30%,#ff2d55aa)}100%{opacity:0}}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;padding:12px 14px 16px;display:flex;flex-direction:column;gap:10px}
.hud{display:flex;align-items:center;gap:12px}
.hud small{display:block;font-size:.72rem;color:var(--muted);font-weight:500;line-height:1}
.hud b{font-size:1.5rem;line-height:1.1;display:inline-block}
.hud .grow{flex:1}
.hearts{display:flex;gap:4px;font-size:1.5rem;color:#ff2d55}
.hearts span{transition:transform .3s,opacity .3s,filter .3s}
.hearts .lost{opacity:.25;transform:scale(.7);filter:grayscale(1)}
.icon{border:1px solid var(--line);background:var(--card);color:var(--ink);width:42px;height:42px;border-radius:14px;font-size:1.2rem;cursor:pointer}
.pop{animation:sp .3s cubic-bezier(.3,1.6,.5,1)}
@keyframes sp{50%{transform:scale(1.35)}}
.barwrap{height:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
#bar{display:block;height:100%;width:100%;transform-origin:left;background:linear-gradient(90deg,#2dd4ff,#7a5cff);border-radius:12px}
#bar.urgent{background:linear-gradient(90deg,#ff8a1f,#ff2d55)}
.stage{flex:1;min-height:0;background:var(--stage);border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;box-shadow:0 10px 40px #0006,inset 0 0 0 2px #ffffff12;overflow:hidden}
.stage.shake{animation:shk .45s}
@keyframes shk{15%{transform:translateX(-12px)}35%{transform:translateX(10px)}55%{transform:translateX(-7px)}75%{transform:translateX(4px)}}
.word{font-size:clamp(3.2rem,19vw,5.8rem);font-weight:700;letter-spacing:.03em;text-shadow:0 0 28px currentColor;min-height:1.2em;color:#fff}
.word.in{animation:win .34s cubic-bezier(.2,1.6,.4,1)}
.word.out{animation:wout .18s ease-in forwards}
@keyframes win{from{transform:scale(.3) rotate(-8deg);opacity:0}}
@keyframes wout{to{transform:scale(1.5);opacity:0}}
.tip{margin:10px 0 0;color:#b9b5ea;font-size:.95rem}
.combo{position:absolute;top:14px;right:16px;color:#ffd21f;font-weight:700;font-size:1.1rem;opacity:0;transform:scale(.6);transition:all .25s cubic-bezier(.3,1.6,.5,1)}
.combo.on{opacity:1;transform:scale(1)}
.btns{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
.btns.six{grid-template-columns:repeat(3,1fr)}
.cb{--c:#888;font:inherit;font-weight:700;font-size:1.1rem;height:66px;border:0;border-radius:20px;background:var(--c);cursor:pointer;
  box-shadow:0 6px 0 color-mix(in srgb,var(--c) 55%,#000),0 12px 18px #0004;transform:translateY(0);transition:transform .08s,box-shadow .08s;animation:bin .45s cubic-bezier(.3,1.5,.5,1) backwards;animation-delay:calc(var(--i)*60ms)}
.cb:active,.cb.hit{transform:translateY(5px);box-shadow:0 1px 0 color-mix(in srgb,var(--c) 55%,#000)}
.cb.hit{filter:brightness(1.25) saturate(1.2)}
.cb.bad{animation:shk .35s}
.cb.hint{animation:hint .5s ease 2}
.cb:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
@keyframes bin{from{transform:translateY(40px) scale(.6);opacity:0}}
@keyframes hint{50%{transform:scale(1.1);filter:brightness(1.4)}}
.screen{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;background:color-mix(in srgb,var(--bg2) 88%,transparent);backdrop-filter:blur(8px);animation:fade .35s ease}
.screen[hidden]{display:none}
@keyframes fade{from{opacity:0}}
.screen h1{margin:0;font-size:2.1rem}
.screen h2{margin:0;font-size:1.8rem}
.screen p{margin:0;color:var(--muted);max-width:28ch;line-height:1.4}
.demo{font-size:4rem;font-weight:700;text-shadow:0 0 24px currentColor;animation:float 2.6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
.play{font:inherit;font-weight:700;font-size:1.4rem;padding:14px 44px;border:0;border-radius:999px;color:#fff;background:linear-gradient(180deg,#8f74ff,#6a45f0);box-shadow:0 6px 0 #3e25a8,0 14px 24px #0004;cursor:pointer;animation:pulse 1.6s ease-in-out infinite}
.play:active{transform:translateY(5px);box-shadow:0 1px 0 #3e25a8}
.play:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
@keyframes pulse{50%{transform:scale(1.06)}}
.big{font-size:3.4rem;font-weight:700}
#cd{font-size:7rem;font-weight:700;animation:cdp .8s ease-out}
@keyframes cdp{from{transform:scale(2.2);opacity:0}30%{opacity:1}to{transform:scale(.9)}}
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;z-index:15;font-size:2.4rem;font-weight:700;pointer-events:none;opacity:0;text-shadow:0 4px 20px #0008;color:#fff}
#banner.go{animation:ban 1.5s ease-out}
@keyframes ban{0%{opacity:0;transform:scale(.4)}20%{opacity:1;transform:scale(1.15)}75%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.2) translateY(-30px)}}
.fl{position:fixed;z-index:25;font-weight:700;font-size:1.7rem;pointer-events:none;transform:translate(-50%,-50%);animation:fl .9s ease-out forwards;text-shadow:0 2px 10px #000a}
@keyframes fl{to{transform:translate(-50%,-160%) scale(1.3);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="fx"></canvas>
<div id="flash"></div>
<div id="app">
  <header class="hud">
    <div><small>Score</small><b id="score">0</b></div>
    <div><small>Level</small><b id="lvl">1</b></div>
    <div class="grow"></div>
    <div class="hearts" id="hearts" aria-label="Lives"></div>
    <button class="icon" id="snd" type="button" aria-label="Toggle sound">🔊</button>
  </header>
  <div class="barwrap"><i id="bar"></i></div>
  <section class="stage" id="stage">
    <div class="combo" id="combo"></div>
    <div class="word" id="word" aria-live="polite"></div>
    <p class="tip">Tap the colour of the ink</p>
  </section>
  <nav class="btns" id="btns"></nav>
  <div id="banner"></div>

  <div class="screen" id="menu">
    <div class="demo" id="demo">RED</div>
    <h1>Stroop Challenge</h1>
    <p>Words appear in clashing colours. Tap the colour you see, not the word you read. It gets faster every level.</p>
    <p id="menuBest"></p>
    <button class="play" id="play" type="button">Play</button>
  </div>
  <div class="screen" id="over" hidden>
    <h2 id="ovT">Game over</h2>
    <div class="big" id="ovS">0</div>
    <p id="ovP"></p>
    <button class="play" id="again" type="button">Play again</button>
  </div>
  <div class="screen" id="cdw" hidden><div id="cd"></div></div>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id);
const COLORS=[{n:"RED",c:"#ff2d55",t:"#fff"},{n:"BLUE",c:"#2f7bff",t:"#fff"},{n:"GREEN",c:"#1fc766",t:"#fff"},{n:"YELLOW",c:"#ffd21f",t:"#3a2d00"},{n:"ORANGE",c:"#ff8a1f",t:"#fff"},{n:"PURPLE",c:"#a855f7",t:"#fff"}];
const RM=matchMedia("(prefers-reduced-motion:reduce)").matches;

/* ---------- audio ---------- */
let AC=null,mg=null,on=true,mus=null,mstep=0;
function ac(){
  if(!AC){try{
    AC=new(window.AudioContext||window.webkitAudioContext)();
    mg=AC.createGain();mg.gain.value=.6;
    const lp=AC.createBiquadFilter();lp.type="lowpass";lp.frequency.value=4800;
    const d=AC.createDelay();d.delayTime.value=.18;
    const f=AC.createGain();f.gain.value=.25;const w=AC.createGain();w.gain.value=.25;
    mg.connect(lp);lp.connect(AC.destination);lp.connect(d);d.connect(f);f.connect(d);d.connect(w);w.connect(AC.destination);
  }catch(e){AC=null}}
  if(AC&&AC.state==="suspended")AC.resume();
  return on&&AC?AC:null;
}
function tone(f,t,d,v,type,g2){
  const a=ac();if(!a)return;
  const o=a.createOscillator(),g=a.createGain(),n=a.currentTime+t;
  o.type=type||"sine";o.frequency.setValueAtTime(f,n);
  if(g2)o.frequency.exponentialRampToValueAtTime(g2,n+d);
  g.gain.setValueAtTime(.0001,n);g.gain.linearRampToValueAtTime(v,n+.01);g.gain.exponentialRampToValueAtTime(.0001,n+d);
  o.connect(g);g.connect(mg);o.start(n);o.stop(n+d+.05);
}
const PENT=[0,2,4,7,9];
const hz=s=>261.63*Math.pow(2,(PENT[s%5]+12*Math.floor(s/5))/12);
const sfx={
  good(k){const s=Math.min(k,14);tone(hz(s),0,.35,.22,"triangle");tone(hz(s)*2,0,.2,.07,"sine");tone(hz(s+2),.07,.3,.12,"triangle")},
  bad(){tone(190,0,.4,.25,"sawtooth",70);tone(95,0,.3,.2,"sine")},
  slow(){tone(330,0,.5,.18,"sine",110)},
  tick(){tone(1300,0,.04,.05,"square")},
  beep(hi){tone(hi?988:587,0,.2,.13,"square")},
  level(){[0,2,4,7,9].forEach((s,i)=>tone(hz(s+5),i*.08,.6,.15,"triangle"))},
  over(){[9,7,4,2,0].forEach((s,i)=>tone(hz(s),i*.17,.8,.15,"triangle"))},
  best(){[0,4,7,9,12].forEach((s,i)=>tone(hz(s),i*.1,.9,.14,"triangle"))}
};
function music(){
  clearTimeout(mus);if(!S.playing)return;
  const bpm=100+S.level*6,ms=60000/bpm/2,B=[65.4,65.4,98,98,87.3,87.3,98,73.4];
  if(on&&AC){
    if(mstep%2===0)tone(B[(mstep>>1)%8],0,ms/1000*1.8,.1,"triangle");
    if(mstep%4===0)tone(130,0,.14,.16,"sine",42);
    if(mstep%2===1)tone(hz([0,2,4,2][(mstep>>1)%4]+5),0,.16,.03,"sine");
  }
  mstep++;mus=setTimeout(music,ms);
}

/* ---------- particles ---------- */
const cv=$("fx"),cx=cv.getContext("2d");let P=[],running=false;
const dpr=Math.min(window.devicePixelRatio||1,2);
function resize(){cv.width=innerWidth*dpr;cv.height=innerHeight*dpr}
addEventListener("resize",resize);resize();
function burst(x,y,col,n,spd){
  if(RM)return;
  for(let i=0;i<n;i++){const a=Math.random()*6.283,s=(Math.random()*.7+.3)*spd;
    P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,l:1,d:.014+Math.random()*.02,r:3+Math.random()*4,c:col,sq:Math.random()<.5})}
  if(!running){running=true;requestAnimationFrame(frame)}
}
function frame(){
  cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,innerWidth,innerHeight);
  P=P.filter(p=>p.l>0&&p.y<innerHeight+40);
  for(const p of P){p.x+=p.vx;p.y+=p.vy;p.vy+=.22;p.vx*=.99;p.l-=p.d;
    cx.globalAlpha=Math.max(p.l,0);cx.fillStyle=p.c;
    if(p.sq)cx.fillRect(p.x,p.y,p.r*1.4,p.r*1.4);else{cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.283);cx.fill()}}
  cx.globalAlpha=1;
  if(P.length)requestAnimationFrame(frame);else{running=false;cx.clearRect(0,0,innerWidth,innerHeight)}
}
function confetti(){COLORS.forEach((c,i)=>setTimeout(()=>burst(innerWidth*(.15+i*.14),innerHeight*.3,c.c,18,9),i*70))}

/* ---------- game ---------- */
const S={score:0,level:1,lives:3,streak:0,hits:0,pool:COLORS.slice(0,4),cur:0,lw:-1,li:-1,t0:0,dur:3400,active:false,raf:0,playing:false,lt:0,hid:0};
const TARGET_ORIGIN=window.location.origin&&window.location.origin!=="null"?window.location.origin:"*";
const edtechraBridge={active:false,mode:"standalone",maxPoints:100,startTime:Date.now(),reported:false,attempts:0};
window.addEventListener("message",ev=>{
  if(TARGET_ORIGIN!=="*"&&ev.origin!==TARGET_ORIGIN)return;
  const msg=ev.data;if(!msg||msg.type!=="EDTECHRA_INIT_GAME")return;
  const p=msg.payload&&typeof msg.payload==="object"?msg.payload:msg;
  edtechraBridge.active=true;edtechraBridge.mode=p.mode||"student";
  edtechraBridge.maxPoints=Number(p.maxPoints)||100;
  edtechraBridge.startTime=Date.now();edtechraBridge.reported=false;
});
function reportToEdtechra(scoreEarned,maxRaw,details){
  if(edtechraBridge.reported||window.parent===window)return;
  edtechraBridge.reported=true;
  const sec=Math.max(1,Math.round((Date.now()-edtechraBridge.startTime)/1000));
  window.parent.postMessage({type:"EDTECHRA_GAME_COMPLETE",payload:{gameId:"stroop-challenge",scoreEarned,maxAvailablePoints:maxRaw,completionStatus:"completed",timeTakenSeconds:sec,details}},TARGET_ORIGIN);
}
let best=0;try{best=+localStorage.getItem("stroop-best")||0}catch(e){}
const btnsEl=$("btns"),wordEl=$("word"),stage=$("stage");
let btns=[];

function hud(){
  $("score").textContent=S.score;$("lvl").textContent=S.level;
  $("hearts").innerHTML=[0,1,2].map(i=>`<span class="${i>=S.lives?"lost":""}">♥</span>`).join("");
  const m=Math.min(1+Math.floor(S.streak/5),5),cb=$("combo");
  cb.textContent=`🔥 ${S.streak}  x${m}`;cb.classList.toggle("on",S.streak>=2);
}
function bump(id){const e=$(id);e.classList.remove("pop");void e.offsetWidth;e.classList.add("pop")}
function buildBtns(){
  btnsEl.innerHTML="";btnsEl.classList.toggle("six",S.pool.length>4);
  btns=S.pool.map((c,i)=>{
    const b=document.createElement("button");b.type="button";b.className="cb";
    b.style.setProperty("--c",c.c);b.style.setProperty("--i",i);b.style.color=c.t;
    b.textContent=c.n;b.setAttribute("aria-label",c.n);
    b.addEventListener("pointerdown",e=>{e.preventDefault();answer(i,b)});
    btnsEl.appendChild(b);return b;
  });
}
function nextWord(){
  const p=S.pool;let w=Math.floor(Math.random()*p.length),ink;
  if(Math.random()<Math.max(.1,.28-S.level*.02))ink=w;
  else{do{ink=Math.floor(Math.random()*p.length)}while(ink===w)}
  if(w===S.lw&&ink===S.li)return nextWord();
  S.lw=w;S.li=ink;S.cur=ink;
  wordEl.textContent=p[w].n;wordEl.style.color=p[ink].c;
  wordEl.className="word";void wordEl.offsetWidth;wordEl.classList.add("in");
  S.dur=Math.max(1000,3400*Math.pow(.92,S.level-1));
  S.t0=performance.now();S.active=true;tick();
}
function tick(){
  cancelAnimationFrame(S.raf);
  const f=()=>{
    if(!S.active)return;
    const now=performance.now(),r=1-(now-S.t0)/S.dur,bar=$("bar");
    bar.style.transform=`scaleX(${Math.max(r,0)})`;bar.classList.toggle("urgent",r<.3);
    if(r<.3&&now-S.lt>300){S.lt=now;sfx.tick()}
    if(r<=0){S.active=false;fail("Too slow!")}else S.raf=requestAnimationFrame(f);
  };
  S.raf=requestAnimationFrame(f);
}
function pos(){const r=wordEl.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]}
function float(t,x,y,c){const e=document.createElement("div");e.className="fl";e.textContent=t;e.style.left=x+"px";e.style.top=y+"px";e.style.color=c;document.body.appendChild(e);setTimeout(()=>e.remove(),950)}
function flash(k){const f=$("flash");f.className="";void f.offsetWidth;f.className=k}
function answer(i,b){
  if(!S.active||!S.playing)return;
  S.active=false;cancelAnimationFrame(S.raf);
  edtechraBridge.attempts++;
  const ok=i===S.cur;
  if(b){b.classList.add(ok?"hit":"bad");setTimeout(()=>b.classList.remove("hit","bad"),320)}
  ok?good():fail("Wrong!",b);
}
function good(){
  S.streak++;
  const m=Math.min(1+Math.floor(S.streak/5),5),frac=Math.max(0,1-(performance.now()-S.t0)/S.dur);
  const pts=(10+Math.round(frac*10))*m;S.score+=pts;S.hits++;
  const [x,y]=pos(),col=S.pool[S.cur].c;
  burst(x,y,col,26,8);float("+"+pts,x,y-40,col);flash("good");sfx.good(S.streak);
  hud();bump("score");
  wordEl.classList.remove("in");wordEl.classList.add("out");
  setTimeout(()=>{if(!S.playing)return;if(S.hits%5===0)levelUp();nextWord()},190);
}
function fail(msg){
  S.lives--;S.streak=0;
  const [x,y]=pos();float(msg,x,y-40,"#ff6b86");flash("bad");
  msg==="Too slow!"?sfx.slow():sfx.bad();
  if(navigator.vibrate)try{navigator.vibrate(70)}catch(e){}
  stage.classList.remove("shake");void stage.offsetWidth;stage.classList.add("shake");
  if(btns[S.cur]){btns[S.cur].classList.add("hint");setTimeout(()=>btns[S.cur]&&btns[S.cur].classList.remove("hint"),1000)}
  hud();
  if(S.lives<=0){S.playing=false;clearTimeout(mus);setTimeout(gameOver,800)}
  else setTimeout(()=>{if(S.playing)nextWord()},900);
}
function banner(t){const b=$("banner");b.textContent=t;b.className="";void b.offsetWidth;b.className="go"}
function levelUp(){
  S.level++;
  $("bg").style.filter=`hue-rotate(${(S.level-1)*38}deg)`;
  if(S.level===4){S.pool=COLORS.slice();buildBtns();banner("Level 4: new colours!")}
  else banner("Level "+S.level+": faster!");
  confetti();sfx.level();hud();bump("lvl");
}
function gameOver(){
  sfx.over();
  const nb=S.score>best&&S.score>0;
  if(nb){best=S.score;try{localStorage.setItem("stroop-best",best)}catch(e){}}
  const acc=edtechraBridge.attempts>0?Math.round((S.hits/edtechraBridge.attempts)*100):0;
  reportToEdtechra(S.score,Math.max(S.score,300),{
    rawScore:S.score,
    levelReached:S.level,
    correctAnswers:S.hits,
    totalAnswered:edtechraBridge.attempts,
    accuracyPct:acc,
    bestScore:best
  });
  $("ovT").textContent=nb?"New best score!":"Game over";
  $("ovS").textContent=S.score;
  $("ovP").textContent=`You reached level ${S.level}. Best score: ${best}.`;
  $("over").hidden=false;
  if(nb){confetti();setTimeout(sfx.best,900)}
}
function start(){
  ac();
  edtechraBridge.attempts=0;edtechraBridge.startTime=Date.now();edtechraBridge.reported=false;
  Object.assign(S,{score:0,level:1,lives:3,streak:0,hits:0,pool:COLORS.slice(0,4),lw:-1,li:-1,active:false,playing:false});
  $("bg").style.filter="hue-rotate(0deg)";
  $("menu").hidden=true;$("over").hidden=true;
  wordEl.textContent="";$("bar").style.transform="scaleX(1)";
  buildBtns();hud();
  const cd=$("cd"),w=$("cdw");w.hidden=false;
  [["3",0],["2",0],["1",0],["Go!",1]].forEach(([t,hi],i)=>setTimeout(()=>{
    cd.textContent=t;cd.style.animation="none";void cd.offsetWidth;cd.style.animation="";sfx.beep(hi)},i*800));
  setTimeout(()=>{w.hidden=true;S.playing=true;mstep=0;music();nextWord()},3200);
}
$("play").addEventListener("click",start);
$("again").addEventListener("click",start);
$("snd").addEventListener("click",()=>{on=!on;$("snd").textContent=on?"🔊":"🔇";if(on){ac();tone(hz(5),0,.4,.15,"triangle")}});
addEventListener("keydown",e=>{const n=parseInt(e.key,10);if(n>=1&&n<=S.pool.length&&btns[n-1])answer(n-1,btns[n-1])});
