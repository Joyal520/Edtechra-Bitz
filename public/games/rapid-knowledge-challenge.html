<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rapid knowledge challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#d9f0ff;--card:#fff;--text:#0b2545;--mute:#4c6385;--edge:#bcd6ec;--sun:#ffd23f;--ok:#1fb89c;--bad:#e8456b;--sky:#4aa8ff;--coral:#ff7a59;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1a33;--card:#112749;--text:#eaf4ff;--mute:#9db6d6;--edge:#24426b;color-scheme:dark}}
:root[data-theme="light"]{--bg:#d9f0ff;--card:#fff;--text:#0b2545;--mute:#4c6385;--edge:#bcd6ec;color-scheme:light}
:root[data-theme="dark"]{--bg:#0a1a33;--card:#112749;--text:#eaf4ff;--mute:#9db6d6;--edge:#24426b;color-scheme:dark}
html{height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:400 16px/1.5 "Nunito Sans",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
[hidden]{display:none!important}
#app{max-width:560px;margin:0 auto;padding:1.2rem 1rem 2.5rem}
h1,.big,.q{font-family:"Bricolage Grotesque",system-ui,sans-serif}
h1{margin:.2rem 0 .3rem;font-weight:800;font-size:clamp(2rem,9vw,2.7rem);line-height:1.04;text-align:center}
.sub{margin:0 auto;text-align:center;color:var(--mute);max-width:24rem}
.ringwrap{position:relative;width:150px;height:150px;margin:1.2rem auto}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap circle{fill:none;stroke-width:11}
.rt{stroke:var(--edge)}.rp{stroke:var(--sun);stroke-linecap:round;transition:stroke-dashoffset .1s linear,stroke .3s}
.ringwrap.low .rp{stroke:var(--bad)}
.ringwrap .n{position:absolute;inset:0;display:grid;place-items:center;font:800 3.2rem/1 "Bricolage Grotesque",sans-serif}
.ringwrap .n small{display:block;font:600 .8rem "Nunito Sans";color:var(--mute);text-align:center;margin-top:-.2rem}
.lbl{margin:1.1rem 0 .5rem;font-weight:700;font-size:.92rem;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{padding:.5rem .9rem;border-radius:999px;background:var(--card);border:2px solid var(--edge);font-weight:600;font-size:.9rem;transition:background .15s,border-color .15s}
.chip small{color:var(--mute);font-weight:600;margin-left:.25rem}
.chip[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--bg)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.7}
.go{display:block;width:100%;margin-top:1.4rem;padding:1rem;border-radius:20px;background:var(--sun);color:#0b2545;font:800 1.35rem "Bricolage Grotesque",sans-serif;box-shadow:0 6px 0 #c89a00;transition:transform .1s,box-shadow .1s}
.go:active{transform:translateY(5px);box-shadow:0 1px 0 #c89a00}
.go:disabled{opacity:.5;box-shadow:none;cursor:not-allowed}
.go.alt{background:var(--card);color:var(--text);box-shadow:0 6px 0 var(--edge);font-size:1.1rem}
.go.alt:active{box-shadow:0 1px 0 var(--edge)}
.best{text-align:center;color:var(--mute);margin:.8rem 0 0;font-weight:600}
.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.5rem}
.hud .ringwrap{width:84px;height:84px;margin:0}
.hud .ringwrap circle{stroke-width:9}
.hud .ringwrap .n{font-size:1.9rem}
.stat{font-weight:700;font-variant-numeric:tabular-nums;font-size:1.05rem}
.stat.r{text-align:right}
.stat span{display:block;font:800 1.7rem/1 "Bricolage Grotesque",sans-serif}
.pop{animation:up .6s ease-out}
.card{background:var(--card);border:2px solid var(--edge);border-radius:24px;padding:1.2rem 1.1rem 1.4rem;margin:1rem 0 .9rem;min-height:9.5rem;display:flex;flex-direction:column;justify-content:center}
.tag{align-self:flex-start;font-size:.8rem;font-weight:700;color:var(--mute);margin-bottom:.4rem}
.q{font-weight:700;font-size:clamp(1.3rem,5.8vw,1.75rem);line-height:1.2}
.opts{display:grid;gap:.6rem}
.opt{display:flex;align-items:center;gap:.8rem;text-align:left;padding:.7rem .9rem;border-radius:18px;background:var(--card);border:2px solid var(--edge);box-shadow:0 4px 0 var(--edge);font-weight:700;font-size:1.05rem;transition:transform .08s,box-shadow .08s,background .12s}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.opt b{flex:none;width:2.1rem;height:2.1rem;border-radius:10px;display:grid;place-items:center;color:#0b2545;font:800 1rem "Bricolage Grotesque",sans-serif}
.opt.ok{background:var(--ok);border-color:var(--ok);box-shadow:0 4px 0 #0f7f6a;color:#04201b}
.opt.no{background:var(--bad);border-color:var(--bad);box-shadow:0 4px 0 #a52346;color:#fff;animation:sh .35s}
.opt.dim{opacity:.55}
.opts.lock{pointer-events:none}
.res{text-align:center}
.res .big{font-size:4.2rem;font-weight:800;line-height:1;margin:.6rem 0 .1rem}
.res .nb{display:inline-block;background:var(--sun);color:#0b2545;font-weight:800;border-radius:999px;padding:.2rem .9rem;margin:.3rem 0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin:1rem 0}
.grid div{background:var(--card);border:2px solid var(--edge);border-radius:16px;padding:.6rem .2rem;font-size:.78rem;color:var(--mute);font-weight:600}
.grid b{display:block;font:800 1.4rem/1.1 "Bricolage Grotesque",sans-serif;color:var(--text)}
.miss{text-align:left;margin:1rem 0 0;padding:0;list-style:none}
.miss li{background:var(--card);border-left:6px solid var(--bad);border-radius:12px;padding:.6rem .8rem;margin:.45rem 0;font-size:.92rem}
.miss b{color:var(--ok)}
@keyframes sh{20%{transform:translateX(-7px)}50%{transform:translateX(7px)}80%{transform:translateX(-3px)}}
@keyframes up{0%{transform:translateY(8px);opacity:0}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.opt.no,.pop{animation:none}.rp{transition:none}}
</style>
</head>
<body>
<div id="app">
<section id="home">
  <h1>Rapid knowledge challenge</h1>
  <p class="sub">Answer as many questions as you can before the clock runs out.</p>
  <div class="ringwrap" id="hring"><svg viewBox="0 0 100 100"><circle class="rt" cx="50" cy="50" r="44"/><circle class="rp" cx="50" cy="50" r="44" stroke-dasharray="276.5" stroke-dashoffset="0"/></svg><div class="n"><div id="hnum">30<small>seconds</small></div></div></div>
  <div class="lbl">Time</div>
  <div class="chips" id="durs"><button class="chip" data-d="30">30 seconds</button><button class="chip" data-d="60">60 seconds</button></div>
  <div class="lbl">Categories</div>
  <div class="chips" id="cats"></div>
  <button class="go" id="start">Start</button>
  <p class="best" id="best"></p>
</section>

<section id="game" hidden>
  <div class="hud">
    <div class="stat">Streak<span id="st">0</span></div>
    <div class="ringwrap" id="gring"><svg viewBox="0 0 100 100"><circle class="rt" cx="50" cy="50" r="44"/><circle class="rp" id="gp" cx="50" cy="50" r="44" stroke-dasharray="276.5" stroke-dashoffset="0"/></svg><div class="n" id="gnum">30</div></div>
    <div class="stat r">Score<span id="sc">0</span></div>
  </div>
  <div class="card"><div class="tag" id="tag"></div><div class="q" id="q"></div></div>
  <div class="opts" id="opts" role="group" aria-label="Answers"></div>
  <p class="best" id="live" role="status" aria-live="polite" style="min-height:1.5em"></p>
</section>

<section id="end" class="res" hidden></section>
</div>

<script>
(function(){
  var DB=[],POOL={},CATS=[["English","📖"],["Science","🔬"],["Mathematics","➗"],["ICT","💻"],["General Knowledge","💡"],["History","🏛️"],["Geography","🗺️"]];
  /* add(cat,pool,"question|answer[|d1,d2,d3]" lines) and tab(cat,pool,template,"a:b;c:d",reverseTemplate,reversePool) */
  function add(c,p,s){s.split("\n").forEach(function(l){l=l.trim();if(!l)return;var x=l.split("|");DB.push({c:c,q:x[0],a:x[1],p:p,x:x[2]})})}
  function tab(c,p,qt,s,rt,rp){s.split(";").forEach(function(r){var x=r.split(":");
    DB.push({c:c,q:qt.replace("{0}",x[0]).replace("{1}",x[1]),a:x[1],p:p});
    if(rt)DB.push({c:c,q:rt.replace("{0}",x[0]).replace("{1}",x[1]),a:x[0],p:rp})})}

  /* ---------- Geography ---------- */
  var G="Geography";
  tab(G,"cap","What is the capital of {0}?","Japan:Tokyo;France:Paris;Italy:Rome;Germany:Berlin;Spain:Madrid;Portugal:Lisbon;United Kingdom:London;Ireland:Dublin;Egypt:Cairo;Kenya:Nairobi;Nigeria:Abuja;Ghana:Accra;Ethiopia:Addis Ababa;Morocco:Rabat;South Africa:Pretoria;Canada:Ottawa;United States:Washington, D.C.;Mexico:Mexico City;Brazil:Brasília;Argentina:Buenos Aires;Chile:Santiago;Peru:Lima;Colombia:Bogotá;Cuba:Havana;Australia:Canberra;New Zealand:Wellington;China:Beijing;India:New Delhi;Pakistan:Islamabad;Bangladesh:Dhaka;Nepal:Kathmandu;Thailand:Bangkok;Vietnam:Hanoi;Indonesia:Jakarta;Philippines:Manila;Malaysia:Kuala Lumpur;South Korea:Seoul;Russia:Moscow;Turkey:Ankara;Greece:Athens;Poland:Warsaw;Sweden:Stockholm;Norway:Oslo;Finland:Helsinki;Denmark:Copenhagen;Netherlands:Amsterdam;Belgium:Brussels;Switzerland:Bern;Austria:Vienna;Saudi Arabia:Riyadh;Iran:Tehran;Iraq:Baghdad;Ukraine:Kyiv;Jordan:Amman;Cambodia:Phnom Penh","{1} is the capital of which country?","country");
  tab(G,"cont","Which continent is {0} in?","Egypt:Africa;Brazil:South America;Japan:Asia;Canada:North America;Australia:Oceania;Italy:Europe;Kenya:Africa;India:Asia;Peru:South America;Mexico:North America;Norway:Europe;New Zealand:Oceania;Nigeria:Africa;Thailand:Asia;Argentina:South America;Poland:Europe;Cuba:North America;Morocco:Africa;Vietnam:Asia;Chile:South America");
  add(G,"cont",`Which continent is almost completely covered by ice?|Antarctica
Which continent has the most countries?|Africa
Which is the largest continent?|Asia`);
  add(G,"ocean",`Which is the largest ocean on Earth?|Pacific Ocean
Which is the smallest ocean?|Arctic Ocean
Which ocean lies between Africa and Australia?|Indian Ocean
Which ocean separates Europe from North America?|Atlantic Ocean
Sri Lanka is an island in which ocean?|Indian Ocean`);
  add(G,"river",`Which is the longest river in Africa?|Nile
Which river flows through London?|Thames
Which river flows through Paris?|Seine
Which river carries the most water in the world?|Amazon
Which river flows through Baghdad?|Tigris
Which river flows through Vienna?|Danube
Which river is sacred in India?|Ganges
Which river flows through Cologne in Germany?|Rhine
Which river flows through Cambodia and Vietnam?|Mekong
Which is the longest river in China?|Yangtze
Which river flows through the city of Cairo?|Nile`);
  add(G,"mount",`Which is the highest mountain above sea level?|Mount Everest
Which mountain range separates Europe from Asia?|Ural Mountains
In which mountain range is Mount Everest?|Himalayas
Which long mountain range is in South America?|Andes
Which is the highest mountain in Africa?|Mount Kilimanjaro
Which mountain range is found in Switzerland?|Alps
Which range runs through western North America?|Rocky Mountains
Which is the longest mountain range on land?|Andes`);
  add(G,"desert",`Which is the largest hot desert in the world?|Sahara Desert
Which desert is in northern Chile?|Atacama Desert
Which desert lies in Mongolia and northern China?|Gobi Desert
Which desert is in Botswana and Namibia?|Kalahari Desert
Which desert covers much of Saudi Arabia?|Arabian Desert`);
  add(G,"island",`Which is the largest island in the world?|Greenland
Which large island lies off the east coast of Africa?|Madagascar
Which island nation lies just south of India?|Sri Lanka
Which island is known as the land of fire and ice?|Iceland
Which is the largest island in the Caribbean?|Cuba`);
  add(G,"country",`Which is the largest country in the world by area?|Russia
Which is the smallest country in the world?|Vatican City
Which country is shaped like a boot?|Italy
Which country has the Great Barrier Reef?|Australia
Which country has a maple leaf on its flag?|Canada
Which country has a red circle on a white flag?|Japan
In which country is the Mississippi River?|United States
Mount Fuji is in which country?|Japan`);
  add(G,"~",`How many states are in the United States?|50`);

  /* ---------- Science ---------- */
  var S="Science";
  add(S,"planet",`Which planet is known as the Red Planet?|Mars
Which planet is closest to the Sun?|Mercury
Which planet is the hottest?|Venus
Which is the third planet from the Sun?|Earth
Which is the largest planet in our solar system?|Jupiter
Which planet is famous for its bright rings?|Saturn
Which planet spins on its side?|Uranus
Which planet is farthest from the Sun?|Neptune
Which is the smallest planet in our solar system?|Mercury
Which planet is the second from the Sun?|Venus
Which planet has a giant storm called the Great Red Spot?|Jupiter`);
  tab(S,"sym","What is the chemical symbol for {0}?","Hydrogen:H;Helium:He;Carbon:C;Nitrogen:N;Oxygen:O;Sodium:Na;Magnesium:Mg;Aluminium:Al;Silicon:Si;Sulfur:S;Chlorine:Cl;Calcium:Ca;Iron:Fe;Copper:Cu;Zinc:Zn;Silver:Ag;Gold:Au;Lead:Pb;Potassium:K;Mercury:Hg","Which element has the symbol {1}?","elem");
  tab(S,"agrp","Which group of animals does a {0} belong to?","dolphin:Mammals;eagle:Birds;frog:Amphibians;snake:Reptiles;shark:Fish;butterfly:Insects;whale:Mammals;crocodile:Reptiles;penguin:Birds;salamander:Amphibians;spider:Arachnids;bat:Mammals;turtle:Reptiles;salmon:Fish;ant:Insects;ostrich:Birds;scorpion:Arachnids;toad:Amphibians");
  add(S,"diet",`An animal that eats only plants is called a…|Herbivore
An animal that eats only meat is called a…|Carnivore
An animal that eats plants and animals is called an…|Omnivore
An animal that eats mainly insects is called an…|Insectivore`);
  add(S,"body",`Which organ pumps blood around the body?|Heart
Which organs do we use to breathe?|Lungs
Which organ controls the body and helps us think?|Brain
Which organs filter the blood and make urine?|Kidneys
Which is the largest organ of the human body?|Skin
Which organ mixes food with acid to start digestion?|Stomach
Which is the largest organ inside the body?|Liver`);
  add(S,"gas",`Which gas do plants take in from the air?|Carbon dioxide
Which gas do plants give out during photosynthesis?|Oxygen
Which gas makes up most of Earth’s air?|Nitrogen
Which is the lightest gas?|Hydrogen
Which gas is used to fill floating party balloons?|Helium`);
  add(S,"ppart",`Which part of a plant takes in water from the soil?|Roots
Which part of a plant carries water up to the leaves?|Stem
Which part of a plant makes food using sunlight?|Leaves
Which part of a plant makes seeds?|Flower`);
  add(S,"pterm",`What process do plants use to make food from sunlight?|Photosynthesis
Which green substance in leaves absorbs sunlight?|Chlorophyll
What is the transfer of pollen between flowers called?|Pollination
What is it called when a seed starts to grow?|Germination`);
  tab(S,"unit","What unit do we use to measure {0}?","length:Metre;mass:Kilogram;time:Second;temperature:Degree Celsius;electric current:Ampere;force:Newton;energy:Joule;the volume of a liquid:Litre");
  add(S,"force",`Which force pulls objects towards the Earth?|Gravity
Which force slows things down when surfaces rub together?|Friction
Which force makes a magnet attract iron?|Magnetism
Which force slows down a falling parachute?|Air resistance`);
  add(S,"light",`What do we call light bouncing off a mirror?|Reflection
What do we call light bending as it enters water?|Refraction
What forms when an object blocks light?|Shadow
What do we call the band of colours in a rainbow?|Spectrum`);
  add(S,"energy",`Which energy comes from the Sun?|Solar energy
Which energy comes from moving air?|Wind energy
Which fuels are made from ancient plants and animals?|Fossil fuels
What type of energy is stored in food?|Chemical energy
Which energy comes from flowing water?|Hydropower`);
  add(S,"weather",`What is water falling from clouds called?|Precipitation
What is liquid water turning into vapour called?|Evaporation
What is water vapour turning into droplets called?|Condensation
What is a huge spinning storm over warm ocean water called?|Hurricane`);
  add(S,"instr",`Which instrument measures temperature?|Thermometer
Which instrument measures air pressure?|Barometer
Which instrument makes tiny things look bigger?|Microscope
Which instrument helps us see distant stars?|Telescope
Which instrument do doctors use to hear a heartbeat?|Stethoscope`);
  add(S,"space",`What is the name of our galaxy?|The Milky Way
What is the closest star to Earth?|The Sun
What natural object orbits the Earth?|The Moon
What do we call a pattern of stars in the night sky?|Constellation`);
  add(S,"~",`How many legs does an insect have?|6
How many legs does a spider have?|8
How many hearts does an octopus have?|3
How many bones does an adult human have?|206
How many teeth does a full set of adult teeth have?|32
How many chambers does the human heart have?|4
How many senses do humans traditionally have?|5
How many planets are in our solar system?|8
About how many days does Earth take to orbit the Sun?|365
At what temperature in °C does water boil at sea level?|100
At what temperature in °C does water freeze?|0
How many moons does Earth have?|1`);

  /* ---------- English ---------- */
  var E="English";
  tab(E,"ant","What is the opposite of {0}?","ancient:modern;big:small;hot:cold;fast:slow;happy:sad;day:night;up:down;early:late;full:empty;strong:weak;hard:soft;light:dark;wet:dry;rich:poor;clean:dirty;open:closed;brave:fearful;loud:quiet;tall:short;thick:thin;deep:shallow;smooth:rough;sweet:sour;win:lose;buy:sell;push:pull;begin:end;arrive:depart;accept:refuse;increase:decrease;generous:selfish","What is the opposite of {1}?","ant2");
  tab(E,"syn","Which word means the same as {0}?","big:large;small:tiny;fast:quick;happy:joyful;smart:clever;tired:weary;angry:furious;shout:yell;talk:speak;hard:difficult;pretty:beautiful;scared:frightened;calm:peaceful;rich:wealthy;mistake:error;help:assist;choose:select;buy:purchase;fix:repair;begin:start;end:finish;freezing:icy");
  tab(E,"plu","What is the plural of {0}?","child:children;mouse:mice;foot:feet;tooth:teeth;man:men;woman:women;goose:geese;person:people;leaf:leaves;knife:knives;wolf:wolves;life:lives;shelf:shelves;box:boxes");
  tab(E,"past","What is the past tense of “{0}”?","go:went;eat:ate;run:ran;see:saw;buy:bought;think:thought;swim:swam;write:wrote;take:took;give:gave;teach:taught;catch:caught;drink:drank;fly:flew;bring:brought");
  add(E,"pos",`Which type of word names a person, place or thing?|Noun
Which type of word is an action word?|Verb
Which type of word describes a noun?|Adjective
Which type of word describes a verb?|Adverb
Words like “and” and “but” are called…|Conjunction
Words like “he” and “she” are called…|Pronoun`);
  add(E,"punc",`Which punctuation mark ends a question?|Question mark
Which punctuation mark ends a statement?|Full stop
Which punctuation mark shows excitement?|Exclamation mark
Which punctuation mark joins words like “well-known”?|Hyphen
Which punctuation mark shows missing letters in “don’t”?|Apostrophe`);
  add(E,"lit",`Words that sound the same but have different meanings are called…|Homophones
Words that mean the opposite are called…|Antonyms
Words that mean the same are called…|Synonyms
A comparison using “like” or “as” is a…|Simile
Saying something is something else is a…|Metaphor
A word that imitates a sound, such as “buzz”, is…|Onomatopoeia`);
  add(E,"sp",`Which is the correct spelling?|necessary|neccessary,necesary,neccesary
Which is the correct spelling?|separate|seperate,separete,seprate
Which is the correct spelling?|definitely|definately,definitly,defanitely

Which is the correct spelling?|because|becuase,becase,becouse
Which is the correct spelling?|friend|freind,frend,friand
Which is the correct spelling?|beautiful|beutiful,beautifull,butiful
Which is the correct spelling?|library|libary,librery,liberary
Which is the correct spelling?|grammar|grammer,gramar,grammur
Which is the correct spelling?|receive|recieve,receve,reseive
Which is the correct spelling?|different|diffrent,diferent,differant
Which is the correct spelling?|calendar|calender,calandar,calandor`);
  add(E,"hom",`Choose the right word: Put the books over ___.|there|their,they’re,thare
Choose the right word: ___ going to the park today.|They’re|There,Their,Thay’re
Choose the right word: The dog wagged ___ tail.|its|it’s,its’,itts
Choose the right word: I can ___ the sea from here.|see|sea,c,sie
Choose the right word: I ___ a letter yesterday.|wrote|rote,right,write
Choose the right word: We ___ to the zoo last week.|went|gone,goed,wend`);
  add(E,"~",`How many letters are in the English alphabet?|26
How many vowels are in the English alphabet?|5`);

  /* ---------- ICT ---------- */
  var I="ICT";
  tab(I,"acr","What does {0} stand for?","CPU:Central Processing Unit;RAM:Random Access Memory;ROM:Read Only Memory;USB:Universal Serial Bus;HTML:HyperText Markup Language;URL:Uniform Resource Locator;PDF:Portable Document Format;GPU:Graphics Processing Unit;LAN:Local Area Network;WAN:Wide Area Network;ISP:Internet Service Provider;SSD:Solid State Drive;HDD:Hard Disk Drive;OS:Operating System;HTTP:HyperText Transfer Protocol;IP:Internet Protocol;DNS:Domain Name System;VPN:Virtual Private Network;CSS:Cascading Style Sheets;GUI:Graphical User Interface;AI:Artificial Intelligence;SMS:Short Message Service;JPEG:Joint Photographic Experts Group;QR:Quick Response;LED:Light Emitting Diode;LCD:Liquid Crystal Display","Which abbreviation stands for “{1}”?","abbr");
  add(I,"hw",`Which device do you use to type text into a computer?|Keyboard
Which device do you use to point and click?|Mouse
Which device prints on paper?|Printer
Which device shows the picture from a computer?|Monitor
Which device lets you speak into a computer?|Microphone
Which device copies a paper page into a computer?|Scanner
Which device plays sound from a computer?|Speakers
Which device lets a computer join a network and the internet?|Router
Which part is called the brain of the computer?|CPU
Which device lets you see friends during a video call?|Webcam`);
  add(I,"sw",`Which software do you use to browse the internet?|Web browser
Which software do you use to write documents?|Word processor
Which software works with rows, columns and formulas?|Spreadsheet
Which software helps you make slides for a talk?|Presentation software
Which software protects a computer from viruses?|Antivirus software
Which software manages the computer, such as Windows?|Operating system
Which software stores and organises lots of data?|Database`);
  add(I,"ext",`Which file ending is used for a photo?|.jpg
Which file ending is used for a music file?|.mp3
Which file ending is used for a Word document?|.docx
